spring:
  application:
    name: google-sheets-integration

  datasource:
    url: jdbc:postgresql://localhost:5432/gs-integration
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db.migration

bling:
  api:
    url: https://api.bling.com.br/Api/v3
    client-id: ${BLING_CLIENT_ID}
    client-secret: ${BLING_CLIENT_SECRET}

app:
  auth:
    state-token: ${APP_AUTH_STATE_TOKEN}


